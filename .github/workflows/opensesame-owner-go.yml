name: OpenSesame Owner GO

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: opensesame-go-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository_owner == 'RyoSAKu610' &&
      github.event.issue.user.login == 'RyoSAKu610' &&
      github.event.issue.title == '[OpenSesame TEST] ping'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opensesame-cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run selftest
      - run: node issue-command-runner.mjs
      - name: Comment run result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="OpenSesame chat trigger TEST finished with status **${{ job.status }}**. Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"

  agentsoul:
    if: >-
      github.repository_owner == 'RyoSAKu610' &&
      github.event.issue.user.login == 'RyoSAKu610' &&
      github.event.issue.title == '[OpenSesame GO] agentsoul'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opensesame-cloud
    env:
      OPENSESAME_WRITE_ENABLED: 'true'
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
      PRIVY_SOLANA_WALLET_ID: ${{ secrets.PRIVY_SOLANA_WALLET_ID }}
      PRIVY_SOLANA_WALLET_ADDRESS: ${{ secrets.PRIVY_SOLANA_WALLET_ADDRESS }}
      PRIVY_AGENT_AUTHORIZATION_KEY: ${{ secrets.PRIVY_AGENT_AUTHORIZATION_KEY }}
      AGENTSOUL_PAYTO: ${{ secrets.AGENTSOUL_PAYTO }}
      AGENTSOUL_X402_NETWORK: ${{ secrets.AGENTSOUL_X402_NETWORK }}
      AGENTSOUL_USDC_MINT: ${{ secrets.AGENTSOUL_USDC_MINT }}
      AGENT_NAME: ${{ vars.AGENT_NAME }}
      AGENT_BIO: ${{ vars.AGENT_BIO }}
      AGENT_ART_STYLE: ${{ vars.AGENT_ART_STYLE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run selftest
      - id: go
        run: node issue-command-runner.mjs
      - name: Comment run result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="OpenSesame Agent Soul GO finished with status **${{ job.status }}**. Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"

  mint:
    if: >-
      github.repository_owner == 'RyoSAKu610' &&
      github.event.issue.user.login == 'RyoSAKu610' &&
      github.event.issue.title == '[OpenSesame GO] mint'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opensesame-cloud
    env:
      OPENSESAME_WRITE_ENABLED: 'true'
      ALCHEMY_MAINNET_API_KEY: ${{ secrets.ALCHEMY_MAINNET_API_KEY }}
      ALCHEMY_TESTNET_API_KEY: ${{ secrets.ALCHEMY_TESTNET_API_KEY }}
      PRIVY_APP_ID: ${{ secrets.PRIVY_APP_ID }}
      PRIVY_APP_SECRET: ${{ secrets.PRIVY_APP_SECRET }}
      PRIVY_ADMIN_OWNER_ID: ${{ secrets.PRIVY_ADMIN_OWNER_ID }}
      PRIVY_ADMIN_AUTHORIZATION_KEY: ${{ secrets.PRIVY_ADMIN_AUTHORIZATION_KEY }}
      PRIVY_AGENT_SIGNER_ID: ${{ secrets.PRIVY_AGENT_SIGNER_ID }}
      PRIVY_AGENT_AUTHORIZATION_KEY: ${{ secrets.PRIVY_AGENT_AUTHORIZATION_KEY }}
      PRIVY_EVM_WALLET_ID: ${{ secrets.PRIVY_EVM_WALLET_ID }}
      PRIVY_EVM_WALLET_ADDRESS: ${{ secrets.PRIVY_EVM_WALLET_ADDRESS }}
      PRIVY_EVM_LOCK_POLICY_ID: ${{ secrets.PRIVY_EVM_LOCK_POLICY_ID }}
      PRIVY_SOLANA_WALLET_ID: ${{ secrets.PRIVY_SOLANA_WALLET_ID }}
      PRIVY_SOLANA_WALLET_ADDRESS: ${{ secrets.PRIVY_SOLANA_WALLET_ADDRESS }}
      PRIVY_SOLANA_AGENTSOUL_POLICY_ID: ${{ secrets.PRIVY_SOLANA_AGENTSOUL_POLICY_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run selftest
      - id: go
        run: node issue-command-runner.mjs
      - name: Comment run result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BODY="OpenSesame mint GO finished with status **${{ job.status }}**. Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
