name: OpenSesame Cloud Check

on:
  workflow_dispatch:
  push:
    branches: [opensesame-cloud]
    paths:
      - 'opensesame-cloud/**'
      - '.github/workflows/opensesame-cloud.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opensesame-cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run selftest
      - run: npm run radar
      - name: Agent Soul x402 upstream probe
        continue-on-error: true
        run: npm run agentsoul:probe
