<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OpenSesame — Agent NFT Radar</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0d10;color:#f5f7fa}h1{font-size:2rem}p{color:#aab2bd}.grid{display:grid;gap:12px}.card{border:1px solid #2a3038;border-radius:14px;padding:16px;background:#12161b}.ok{color:#7ee787}.bad{color:#ff7b72}.meta{font-size:.9rem;color:#8b949e}code{background:#1b2027;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>OpenSesame</h1>
  <p>Agent-native NFT radar. Current mode: <code>READ ONLY</code>.</p>
  <div id="status" class="meta">checking…</div>
  <div id="grid" class="grid"></div>
<script>
async function load(){
  const status=document.getElementById('status');
  const grid=document.getElementById('grid');
  try{
    const r=await fetch('/api/status');
    const data=await r.json();
    status.textContent='Checked '+new Date(data.checkedAt).toLocaleString()+' · '+data.mode;
    grid.innerHTML=data.results.map(x=>`<div class="card"><strong>${x.name}</strong><div class="${x.ok?'ok':'bad'}">${x.ok?'ONLINE':'CHECK'} · HTTP ${x.status ?? '—'}</div><div class="meta">${x.latencyMs} ms · ${x.url}</div></div>`).join('');
  }catch(e){status.textContent='status API error: '+e.message;}
}
load();
</script>
</body>
</html>
